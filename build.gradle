plugins {
    id 'scala'
    id 'application'
    id 'idea'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

shadowJar {
    zip64 = true
}

group = 'template.spark'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.scala-lang:scala-library:2.12.18'

    implementation 'org.apache.spark:spark-sql_2.12:3.5.7'
    implementation 'org.apache.spark:spark-mllib_2.12:3.5.7'
    implementation 'org.apache.spark:spark-streaming_2.12:3.5.7'
    implementation 'org.apache.spark:spark-graphx_2.12:3.5.7'

    implementation 'commons-io:commons-io:2.16.1'
}

application {
    mainClass = 'template.spark.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = ['-deprecation', '-feature']
}

tasks.named('run') {
    jvmArgs(
            '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
    )
}